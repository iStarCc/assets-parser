[workspace]
resolver = "3"
members = ["bom", "car", "deepmap2", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/skytoup/car-parser"

[workspace.dependencies]
deku = { version = "^0.20" }
thiserror = "^2.0"
memmap2 = "^0.9"
lzfse_rust = "0.2.1"
lzvn = "0.1.1"
flate2 = "1"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
